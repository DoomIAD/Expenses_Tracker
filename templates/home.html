<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense Tracker</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      margin: 0;
      padding: 0;
    }

    header {
      background: #2563eb;
      color: white;
      padding: 20px;
      text-align: center;
    }

    main {
      max-width: 700px;
      margin: 40px auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    h2 {
      margin-top: 0;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    input[type="text"],
    input[type="email"],
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      box-sizing: border-box;
    }

    textarea {
      resize: vertical;
      min-height: 100px;
    }

    .button-row {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }

    button {
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.2s;
    }

    .primary-btn {
      background: #2563eb;
      color: white;
    }

    .primary-btn:hover {
      background: #1d4ed8;
    }

    .secondary-btn {
      background: #e5e7eb;
      color: #111827;
    }

    .secondary-btn:hover {
      background: #d1d5db;
    }

    footer {
      text-align: center;
      padding: 20px;
      color: #666;
    }
  </style>
</head>

<body>

  <header>
    <h1>Expense Tracker</h1>
    <p>An easy way to visualize your Google Sheet expenses!</p>
  </header>

  <main>

    <h2>Contact Form</h2>

    <div class="form-group">
      <button class="primary-btn" onclick="window.location.href='/add_spreadsheet'">
        Add New Google Sheet
      </button>
    </div>

    <div class="form-group">
      <button class="primary-btn" onclick="window.location.href='/edit_merchants'">
        Edit Merchant Categories
      </button>
    </div>

    <div class="form-group">
      <button class="primary-btn" onclick="window.location.href='/expenditures'">
        View Spending
      </button>
    </div>

  </main>

</body>
</html>
